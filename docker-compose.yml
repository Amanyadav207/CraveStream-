# Local development stack: docker compose up --build
# Secrets come from ./.env (git-ignored); see .env.example.
name: cravestream

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No ports published: only the API can reach the database.

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    # -ip=127.0.0.1 keeps the node identity stable across restarts.
    command: >
      server -ip=127.0.0.1 -ip.bind=0.0.0.0 -dir=/data
      -s3 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    configs:
      - source: s3_config
        target: /etc/seaweedfs/s3.json
    volumes:
      - seaweed-data:/data

  cravestream-api:
    build:
      context: ./Backend
      args:
        APP_VERSION: local
        GIT_SHA: local
    environment:
      PORT: "3000"
      DB_URL: mongodb://mongo:27017/cravestream
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGIN: http://localhost:8080
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: cravestream-media
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      args:
        APP_VERSION: local
        GIT_SHA: local
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - cravestream-api

configs:
  s3_config:
    content: |
      {"identities":[{"name":"cravestream-api",
        "credentials":[{"accessKey":"${S3_ACCESS_KEY_ID}","secretKey":"${S3_SECRET_ACCESS_KEY}"}],
        "actions":["Admin","Read","Write","List","Tagging"]}]}

volumes:
  mongo-data:
  seaweed-data:
