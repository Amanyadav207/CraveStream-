{{- if .Values.ingress.enabled }}
# Layer-7 routing: /api goes straight to the API, everything else to the SPA.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cravestream
  labels: {{- include "cravestream.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cravestream-api
                port: { number: {{ .Values.api.port }} }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cravestream-frontend
                port: { number: {{ .Values.frontend.port }} }
{{- end }}
