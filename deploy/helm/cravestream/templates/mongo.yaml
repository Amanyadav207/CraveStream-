# MongoDB as a StatefulSet: stable identity (mongo-0) and its own
# PersistentVolumeClaim, so data survives pod restarts and rescheduling.
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels: {{- include "cravestream.labels" . | nindent 4 }}
spec:
  clusterIP: None   # headless: gives the stable DNS name mongo-0.mongo
  selector: {{- include "cravestream.selector" (dict "component" "mongo") | nindent 4 }}
  ports:
    - name: mongo
      port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels:
    {{- include "cravestream.labels" . | nindent 4 }}
    {{- include "cravestream.selector" (dict "component" "mongo") | nindent 4 }}
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: {{- include "cravestream.selector" (dict "component" "mongo") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cravestream.selector" (dict "component" "mongo") | nindent 8 }}
    spec:
      serviceAccountName: cravestream
      automountServiceAccountToken: false
      # mongo image's "mongodb" user is uid 999
      securityContext: {{- include "cravestream.podSecurity" (dict "uid" 999) | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongo
          image: {{ .Values.mongo.image }}
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: MONGO_ROOT_USERNAME } }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: MONGO_ROOT_PASSWORD } }
          startupProbe:
            tcpSocket: { port: mongo }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket: { port: mongo }
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources: {{- toYaml .Values.mongo.resources | nindent 12 }}
          securityContext: {{- include "cravestream.containerSecurity" (dict "readOnly" true) | nindent 12 }}
          # Read-only root fs; only the data volume and scratch dirs are writable.
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: tmp
              mountPath: /tmp
            - name: configdb
              mountPath: /data/configdb
      volumes:
        - name: tmp
          emptyDir: {}
        - name: configdb
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mongo.storage }}
