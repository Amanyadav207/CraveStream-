apiVersion: v1
kind: ConfigMap
metadata:
  name: cravestream-api-config
  labels: {{- include "cravestream.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.api.port | quote }}
  NODE_ENV: production
  CORS_ORIGIN: "{{ if .Values.ingress.tls.enabled }}https{{ else }}http{{ end }}://{{ .Values.ingress.host }}"
  COOKIE_SECURE: {{ .Values.ingress.tls.enabled | quote }}
  STORAGE_DRIVER: {{ .Values.api.storageDriver | quote }}
  S3_ENDPOINT: "http://seaweedfs:8333"
  S3_BUCKET: {{ .Values.seaweedfs.bucket | quote }}
  APP_ENV: {{ .Values.global.environment | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cravestream-api
  labels:
    {{- include "cravestream.labels" . | nindent 4 }}
    {{- include "cravestream.selector" (dict "component" "api") | nindent 4 }}
    app.kubernetes.io/version: {{ .Values.api.image.tag | quote }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "cravestream.selector" (dict "component" "api") | nindent 6 }}
  # Rolling update: add one new pod before removing an old one, never drop below desired.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "cravestream.selector" (dict "component" "api") | nindent 8 }}
        app.kubernetes.io/version: {{ .Values.api.image.tag | quote }}
      annotations:
        # Restart pods when config changes.
        checksum/config: {{ toJson .Values.api | sha256sum | trunc 16 }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.api.port | quote }}
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: cravestream
      automountServiceAccountToken: false
      securityContext: {{- include "cravestream.podSecurity" (dict "uid" 1000) | nindent 8 }}
      terminationGracePeriodSeconds: 30
      # Spread replicas across nodes so one node failure does not take the API down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "cravestream.selector" (dict "component" "api") | nindent 14 }}
      containers:
        - name: api
          image: {{ include "cravestream.image" (dict "root" . "img" .Values.api.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: cravestream-api-config
          env:
            - name: DB_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: DB_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: JWT_SECRET } }
            - name: S3_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: S3_ACCESS_KEY_ID } }
            - name: S3_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: S3_SECRET_ACCESS_KEY } }
            - name: IMAGEKIT_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: IMAGEKIT_PRIVATE_KEY, optional: true } }
          # startup: allow slow boot; liveness: process alive (no DB check);
          # readiness: only take traffic when MongoDB is reachable.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            # Give the Service/Ingress time to stop routing here before SIGTERM.
            preStop:
              sleep: { seconds: 5 }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- include "cravestream.containerSecurity" (dict "readOnly" true) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: cravestream-api
  labels:
    {{- include "cravestream.labels" . | nindent 4 }}
    {{- include "cravestream.selector" (dict "component" "api") | nindent 4 }}
spec:
  selector: {{- include "cravestream.selector" (dict "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cravestream-api
  labels: {{- include "cravestream.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "cravestream.selector" (dict "component" "api") | nindent 6 }}
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cravestream-api
  labels: {{- include "cravestream.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cravestream-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
