# SeaweedFS: self-hosted S3-compatible object storage for uploaded videos.
# Internal only (ClusterIP + NetworkPolicy); the API streams videos to users.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels: {{- include "cravestream.labels" . | nindent 4 }}
spec:
  selector: {{- include "cravestream.selector" (dict "component" "seaweedfs") | nindent 4 }}
  ports:
    - name: s3
      port: 8333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  labels:
    {{- include "cravestream.labels" . | nindent 4 }}
    {{- include "cravestream.selector" (dict "component" "seaweedfs") | nindent 4 }}
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels: {{- include "cravestream.selector" (dict "component" "seaweedfs") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cravestream.selector" (dict "component" "seaweedfs") | nindent 8 }}
    spec:
      serviceAccountName: cravestream
      automountServiceAccountToken: false
      securityContext: {{- include "cravestream.podSecurity" (dict "uid" 1000) | nindent 8 }}
      containers:
        - name: seaweedfs
          image: {{ .Values.seaweedfs.image }}
          # -ip=127.0.0.1: stable node identity even though the pod IP changes on restart.
          args:
            - server
            - -ip=127.0.0.1
            - -ip.bind=0.0.0.0
            - -dir=/data
            - -s3
            - -s3.config=/etc/seaweedfs/s3.json
            - -master.volumeSizeLimitMB=1024
          ports:
            - name: s3
              containerPort: 8333
          startupProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 20
          resources: {{- toYaml .Values.seaweedfs.resources | nindent 12 }}
          securityContext: {{- include "cravestream.containerSecurity" (dict "readOnly" true) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: s3-config
          secret:
            secretName: {{ .Values.existingSecret }}
            items:
              - key: s3.json
                path: s3.json
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.seaweedfs.storage }}
