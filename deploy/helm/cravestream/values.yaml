# Default values (shared by every environment).
# Environment differences live in values-dev.yaml / values-prod.yaml.

global:
  environment: dev

# Secrets are NOT stored here. They are created out-of-band
# (scripts/create-secrets.sh) and referenced by name.
existingSecret: cravestream-secrets

image:
  registry: ghcr.io/amanyadav207
  pullPolicy: IfNotPresent

api:
  image:
    repository: cravestream-api
    tag: "local"           # CI/CD sets this to the git commit SHA
  replicas: 2
  port: 3000
  storageDriver: s3
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    minAvailable: 1

frontend:
  image:
    repository: cravestream-frontend
    tag: "local"
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 64Mi }
  pdb:
    minAvailable: 1

mongo:
  image: mongo:7
  storage: 1Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

seaweedfs:
  image: chrislusf/seaweedfs:4.48
  storage: 2Gi
  bucket: cravestream-media
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

ingress:
  enabled: true
  className: traefik
  host: cravestream.localhost
  tls:
    enabled: false
    secretName: cravestream-tls

networkPolicy:
  enabled: true

# Grafana dashboard, ServiceMonitor and SLO alert rules (needs kube-prometheus-stack).
monitoring:
  enabled: true

backup:
  enabled: true
  schedule: "0 2 * * *"   # daily mongodump at 02:00
  storage: 1Gi
