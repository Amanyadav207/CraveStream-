# GitOps for the dev environment: Argo CD watches the Helm chart in git and
# keeps the cluster equal to it.
#  - automated sync: a commit that changes values-dev.yaml (CI bumps the image
#    tag) is deployed without a human
#  - selfHeal: manual changes in the cluster (drift) are reverted
#  - prune: objects removed from git are removed from the cluster
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cravestream-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Amanyadav207/CraveStream-.git
    targetRevision: devops
    path: deploy/helm/cravestream
    helm:
      releaseName: cravestream
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cravestream-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false   # namespace + secrets come from scripts/create-secrets.sh dev
    retry:
      limit: 3
      backoff: { duration: 10s, factor: 2, maxDuration: 2m }
